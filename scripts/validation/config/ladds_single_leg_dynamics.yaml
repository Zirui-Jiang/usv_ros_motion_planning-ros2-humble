# LaDDS 0211 单航段仿真动力学 profile。
# 速度上限为 20 节（20 * 1852 / 3600 ≈ 10.2889 m/s），向上取 10.29，避免恰为 20 节的航点速度因浮点误差被拒。
# 上限只校验请求速度；cruising_speed 用于 RViz 等未给速度的目标，0211 航点速度由任务报文给出。
dynamics:
  name: otter
  type: Differential
  cruising_speed: 2.0
  max_force: 180.0
  mass: 29.84
  i_z: 10.03
  L: 1.35
  W: 1.00
  D: 0.395
  x_dot_u: 5.0
  y_dot_v: 5.0
  n_dot_r: 1.0
  x_u: -20.0
  y_v: -20.0
  n_r: -20.0
  velocity_min: 0.0
  velocity_max: 10.29
  acceleration_min: -1.0
  acceleration_max: 1.0
  jerk_min: -2.0
  jerk_max: 2.0
