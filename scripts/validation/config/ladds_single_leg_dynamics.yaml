  W: 1.00
  D: 0.395
  x_dot_u: 5.0
  y_dot_v: 5.0
  n_dot_r: 1.0
  x_u: -20.0
  y_v: -20.0
  n_r: -20.0
  velocity_min: 0.0
  velocity_max: 2.1
  acceleration_min: -1.0
  acceleration_max: 1.0
  jerk_min: -2.0
  jerk_max: 2.0
