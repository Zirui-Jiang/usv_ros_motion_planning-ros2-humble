controller:
  controller_name: adrc
  control_frequncy: 10.0
  pid_controller:
    goal_distance_tolerance: 1.5
    goal_speed_tolerance: 0.25
    lookahead_time: 2.6
    k_p_speed: 2.0
    k_i_speed: 0.5
    k_d_speed: 0.0
    k_p_course: 2.0
    k_i_course: 0.0
    k_d_course: 0.0
  lqr_controller:
    goal_distance_tolerance: 1.0
    goal_speed_tolerance: 0.25
    lookahead_time: 2.0
    discrete_dt: 0.1
    solve_eps: 0.1
    max_iterations: 5000
    solve_timeout: 0.08
    Q_matrix_diag:
    - 1
    - 1
    - 100
    - 10
    - 10
    - 10
    R_matrix_diag:
    - 20
    - 20
  adrc_controller:
    goal_distance_tolerance: 1.5
    goal_speed_tolerance: 0.25
    lookahead_time: 2.6
    command_limit: 1.0
    sample_time: 0.1
    max_sample_gap: 0.5
    k_p_speed: 8.0
    k_i_speed: 0.8
    force_min: -40.0
    force_max: 40.0
    speed_integral_min: -30.0
    speed_integral_max: 30.0
    k_p_heading: 8.0
    k_d_heading: 4.0
    k_i_heading: 0.03
    moment_min: -10.0
    moment_max: 10.0
    heading_integral_min: -2.0
    heading_integral_max: 2.0
    error_reset_deg: 20.0
    acceleration_gain: 0.0
    filter_window_length: 10
    filter_history_length: 50
