# 限定主线源码与验证脚本的测试入口；importlib 模式避免同名测试文件相互覆盖。
[pytest]
testpaths = src/core/shared/common/test src/core/decision_module/path_planner/test src/core/decision_module/path_processor/test src/core/decision_module/trajectory_planner/test src/core/control_module/controller/test src/core/perception_module/perception/test src/core/shared/usv_navigation/test src/core/decision_module/usv_decision/test src/core/control_module/usv_control/test src/core/perception_module/usv_perception/test src/core/mission_module/usv_mission/test src/core/communication_module/usv_ladds_bridge/test src/sim_env/test scripts/validation
addopts = --import-mode=importlib
