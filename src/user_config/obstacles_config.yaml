# 障碍物生成清单：描述形状、位姿与尺寸，由动态 XML 工具转换为场景元素。
# static obstacles
obstacles:
  - type: BOX
    # 位姿字段按生成器约定解释；改变场景后还需核对起点与目标是否处于可通行水面。
    pose: 5 -2 0.3 0 0 0
    color: WoodFloor
    props:
      mass: 10.00
      width: 10.00
      depth: 20.00
      height: 5.00
  - type: BOX
    pose: -35 -20 0.3 0 0 0
    color: WoodFloor
    props:
      mass: 10.00
      width: 10.00
      depth: 20.00
      height: 5.00
  - type: BOX
    pose: 105 -9 0.3 0 0 0
    color: WoodFloor
    props:
      mass: 10.00
      width: 5.00
      depth: 50.00
      height: 5.00
  - type: BOX
    pose: 55 -9 0.3 0 0 0
    color: WoodFloor
    props:
      mass: 10.00
      width: 5.00
      depth: 30.00
      height: 5.00
