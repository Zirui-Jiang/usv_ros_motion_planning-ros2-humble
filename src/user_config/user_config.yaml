# 场景选择与生成器输入。启动时读取 world 和 robot1_type（otter 或 wamv），命令行的 world:=、robot_type:= 优先。
# 其余 robot1_* 字段当前不读取：导航算法选择以共享算法 YAML 和 launch 覆盖为准，出生位姿用 robot_x 等启动参数。
world: "ocean"
# rviz_file: "sim_env.rviz"
rviz_file: ""

robots_config:
  - robot1_type: "otter"
    robot1_location_method: "ekf"
    robot1_path_planner: "astar"
    robot1_trajectory_planner: "adrc"
    robot1_controller: "adrc"
    robot1_x_pos: "23.0"
    robot1_y_pos: "-10.0"
    robot1_z_pos: "0.0"
    robot1_yaw: "0.0"

plugins:
  obstacles: "obstacles_config.yaml"
