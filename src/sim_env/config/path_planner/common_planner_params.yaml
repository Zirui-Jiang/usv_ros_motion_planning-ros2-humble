planner_name: astar
navigation:
  planning_frequency: 5.0
  state_timeout: 0.5
  map_timeout: 1.5
  trajectory_timeout: 1.0
  planning_timeout: 1.0
  max_expansions: 200000
  costmap_topic: costmap_raw

path_planner:
  # offset of transform from world(x,y) to grid map(x,y)
  convert_offset: 0.0
  # error tolerance
  default_tolerance: 0.0
  # whether outline the map or not
  outline_map: true
  # obstacle inflation factor
  obstacle_factor: 0.5
  # whether publish expand zone or not
  expand_zone: true
  # safety corridor
  show_safety_corridor: false
  # resample path [m]
  enable_resample: true
  resample_ratio: 0.5
