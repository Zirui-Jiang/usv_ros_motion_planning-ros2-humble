# GPS -> local odometry configuration (ROS 2 robot_localization)
/**:
  ros__parameters:
    frequency: 60.0
    magnetic_declination_radians: 0.0
    wait_for_datum: true
    use_odometry_yaw: true
    datum: [63.439358, 10.399541, 0.0]
    yaw_offset: 0.0
    publish_filtered_gps: true
    use_sim_time: true
