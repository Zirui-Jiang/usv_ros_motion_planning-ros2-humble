usv_ladds_rx:
  ros__parameters:
    # Windows 原生 LaDDS 由 TCP relay 转发给 WSL 中的 ROS 2 节点。
    backend: "tcp"
    # 留空时读取 LADDS_LIBRARY_PATH；不指向仓库内的厂商 SDK。
    library_path: ""
    relay_host: "127.0.0.1"
    relay_port: 17880
    relay_timeout: 5.0
    domain_id: 1
    bind_ip: ""
    ttl: 1
    qos: "best_effort"
    # 字符串引号不可去掉，否则 YAML 会丢失前导零。
    send_topic: "0211"
    ownship_send_topic: "0411"
    obstacle_send_topic: "0141"
    receive_topic: "0211"
    # 通用透传默认不启用；航路/停船联调使用 route.yaml 中的 "0331"。
    stop_receive_topic: ""
    ownship_receive_topic: "0411"
    obstacle_receive_topic: "0141"
    ownship_input_topic: ""
    obstacle_input_topic: "/ladds/obstacle_in"
    ownship_output_topic: ""
    obstacle_output_topic: ""
    ownship_json_topic: "/ladds/ownship"
    obstacle_json_topic: "/ladds/obstacle"
    ownship_frame_id: "otter/odom"
    ownship_child_frame_id: "otter/base_link"
    origin_latitude: 30.5453
    origin_longitude: 114.392931
    origin_altitude: 0.0
    src: 0
    dst: 0
    encryption: false
    max_payload_bytes: 1048576
    queue_depth: 100
    poll_interval_sec: 0.01
usv_ladds_radar:
  ros__parameters:
    scan_topic: /otter/sensors/lidars/lidar/scan
    odom_topic: /otter/odom_gt
    output_topic: /ladds/obstacle_in
    origin_latitude: 30.5453
    origin_longitude: 114.392931
    origin_altitude: 0.0
    cluster_gap_m: 3.0
    min_points: 3
    max_targets: 255
    lidar_x: 0.0
    lidar_y: 0.0
