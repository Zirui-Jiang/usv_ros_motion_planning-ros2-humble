usv_ladds_rx:
  ros__parameters:
    backend: tcp
    domain_id: 1
    qos: best_effort
    receive_topic: "0211"
    stop_receive_topic: "0331"
    berth_receive_topic: "0212"
    send_topic: "0052"
    ownship_send_topic: "0411"
    obstacle_send_topic: "0141"
    status_send_topic: "0051"
    progress_send_topic: "0053"
    # 航控桨角/转速命令经 0054 发出；Windows 中继默认登记 0054。留空则不订阅也不发送。
    thrust_send_topic: "0054"
    thrust_input_topic: "/otter/thrusters/vector_cmd"
    # 超过该秒数收不到航控推力命令（含尚未启动）时，看门狗每 0.1 s 发一次零推力。
    thrust_timeout_sec: 0.5
    heartbeat_input_topic: "/otter/navigation/heartbeat"
    ownship_receive_topic: "0411"
    obstacle_receive_topic: "0141"
    ownship_input_topic: "/otter/odom_gt"
    obstacle_input_topic: "/ladds/obstacle_in"
    ownship_output_topic: "/otter/odom"
    obstacle_output_topic: "/ladds/targets"
    ownship_json_topic: "/ladds/ownship"
    obstacle_json_topic: "/ladds/obstacle"
    ownship_frame_id: "otter/odom"
    ownship_child_frame_id: "otter/base_link"
    origin_latitude: 30.5472
    origin_longitude: 114.3891
    origin_altitude: 0.0
usv_ladds_radar:
  ros__parameters:
    scan_topic: /otter/sensors/lidars/lidar/scan
    odom_topic: /otter/odom_gt
    output_topic: /ladds/obstacle_in
    origin_latitude: 30.5472
    origin_longitude: 114.3891
    origin_altitude: 0.0
    cluster_gap_m: 3.0
    min_points: 3
    max_targets: 255
    lidar_x: 0.0
    lidar_y: 0.0
usv_ladds_route:
  ros__parameters:
    origin_latitude: 30.5472
    origin_longitude: 114.3891
    map_frame: otter/map
    navigation_namespace: /otter
    receive_topic: /ladds/rx
    stop_receive_topic: /ladds/stop_rx
    berth_receive_topic: /ladds/berth_rx
    transmit_topic: /ladds/tx
    progress_topic: /ladds/progress_tx
    status_topic: /ladds/task_status
    service_timeout: 5.0
    waypoint_radius: 3.0
