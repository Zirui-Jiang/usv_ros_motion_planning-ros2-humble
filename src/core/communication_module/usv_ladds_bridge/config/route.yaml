usv_ladds_rx:
  ros__parameters:
    backend: tcp
    domain_id: 1
    qos: best_effort
    receive_topic: "0211"
    stop_receive_topic: "0331"
    berth_receive_topic: "0212"
    send_topic: "0052"
    ownship_send_topic: "0411"
    obstacle_send_topic: "0141"
    status_send_topic: "0051"
    progress_send_topic: "0053"
    # 航控桨角/转速命令经 0054 发出；Windows 中继默认登记 0054。留空则不订阅也不发送。
    thrust_send_topic: "0054"
    thrust_input_topic: "/otter/thrusters/vector_cmd"
    # 超过该秒数收不到航控推力命令（含尚未启动）时，看门狗每 0.1 s 发一次零推力。
    thrust_timeout_sec: 0.5
    heartbeat_input_topic: "/otter/navigation/heartbeat"
    ownship_receive_topic: "0411"
    obstacle_receive_topic: "0141"
    ownship_input_topic: "/otter/odom_gt"
    obstacle_input_topic: "/ladds/obstacle_in"
    ownship_output_topic: "/otter/odom"
    obstacle_output_topic: "/ladds/targets"
    ownship_json_topic: "/ladds/ownship"
    # 0141 只收不发：关掉发布节点到接收节点的 0141 回灌，/ladds/targets 只剩 DDS 收到的目标。
    # 需要做上行自检时改回 "/ladds/obstacle"，并把 usv_ladds_radar 的 output_topic 改回 /ladds/obstacle_in。
    obstacle_json_topic: ""
    # 收到的 0141 按与 0411 相同的原点换成地图坐标，画成障碍栅格供 costmap 静态层叠加。
    obstacle_grid_topic: "/otter/ladds/obstacle_grid"
    obstacle_grid_frame: "otter/map"
    obstacle_grid_resolution: 1.0
    obstacle_grid_max_size: 1500.0
    # threatingRadius 缺失或无效时的圆半径（米）；对端按 0.1 米发送时把系数改为 0.1。
    obstacle_default_radius: 5.0
    obstacle_radius_scale: 1.0
    # 0 表示保留到下一包 0141（便于联调工具手发一包）；实船连续发送时可设为若干秒后清空。
    obstacle_timeout_sec: 0.0
    ownship_frame_id: "otter/odom"
    ownship_child_frame_id: "otter/base_link"
    origin_latitude: 39.9450901
    origin_longitude: 116.3342309
    origin_altitude: 0.0
usv_ladds_radar:
  ros__parameters:
    scan_topic: /otter/sensors/lidars/lidar/scan
    odom_topic: /otter/odom_gt
    # 仿真激光目标不再发到 0141（发布节点只转发 /ladds/obstacle_in），避免与对端雷达的 0141 混在一起。
    output_topic: /ladds/lidar_targets
    origin_latitude: 39.9450901
    origin_longitude: 116.3342309
    origin_altitude: 0.0
    cluster_gap_m: 3.0
    min_points: 3
    max_targets: 255
    lidar_x: 0.0
    lidar_y: 0.0
usv_ladds_route:
  ros__parameters:
    origin_latitude: 39.9450901
    origin_longitude: 116.3342309
    map_frame: otter/map
    navigation_namespace: /otter
    receive_topic: /ladds/rx
    stop_receive_topic: /ladds/stop_rx
    berth_receive_topic: /ladds/berth_rx
    transmit_topic: /ladds/tx
    progress_topic: /ladds/progress_tx
    status_topic: /ladds/task_status
    service_timeout: 5.0
    waypoint_radius: 3.0
