# 共享 LOS 导引参数：时间单位秒，几何距离单位米，偏航角速度单位弧度/秒。
trajectory_planner:
  planner_name: los
  los:
    # 输出采样间隔与下一项预测总时域一起决定轨迹长度。
    trajectory_time_interval: 0.5
    trajectory_time: 10.0
    # 接近当前航段点到此距离后可推进路点；每个输出周期最多推进一次。
    switch_dist: 5.0
    goal_tolerance: 1.0
    # Earlier calibration with the Otter/LOS model: 5 m cut through the
    # 12 m cylinder scenario; 1 m passed the full-footprint clearance check.
    # The value in use is 3 m.
    # 横向偏差经 atan2(偏差,预瞄距离) 转为航向修正，较小距离使修正更敏感。
    # 当前取 3 米；上面两句是 5 米和 1 米的历史标定记录，不是对 3 米的验证结论。
    lookahead_distance: 3.0
    yaw_rate_max: 0.8
    kp_yaw: 1.0
    # Keep near-goal replanning from restoring the full cruising speed.
    # 接近终点速度剖面的最小分母尺度，防止短路线重规划恢复满巡航速度。
    slowdown_distance: 20.0
