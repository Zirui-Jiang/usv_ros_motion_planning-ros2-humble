# Otter 普通导航控制参数；PID 与 LQR 共用真实目标距离/速度条件，预瞄时间以秒表示。
controller:
  controller_name: adrc
  # 历史拼写由 configuration.normalize_parameters 映射到 control_frequency，单位 Hz。
  control_frequncy: 10.0

  # 速度环使用平面速度模，航向环使用最短角误差；这组增益直接标定为归一化双桨命令。
  pid_controller:
    goal_distance_tolerance: 1.5
    goal_speed_tolerance: 0.25
    # The old LOS point labelled 3.0 s represented 2.6 s of rollout.
    # Calibrated with the corrected time axis; trajectory age is still applied.
    lookahead_time: 2.6
    k_p_speed: 2.0
    k_i_speed: 0.5
    k_d_speed: 0.0
    k_p_course: 2.0
    k_i_course: 0.0
    k_d_course: 0.0
  
  # LQR 离散时间和求解超时单位秒；迭代上限与残差容差限制每拍 Riccati 求解。
  lqr_controller:
    goal_distance_tolerance: 1.0
    goal_speed_tolerance: 0.25
    # Rolling LOS plans need preview for coupled sway/yaw feedback. Lower
    # position weights and stronger input penalties prevent permanent full thrust.
    lookahead_time: 2.0
    discrete_dt: 0.1
    solve_eps: 0.1
    max_iterations: 5000
    solve_timeout: 0.08
    # Q 依次惩罚 x、y、psi、u、v、r 误差，R 对应左右两路输入。
    Q_matrix_diag: [1, 1, 100, 10, 10, 10]
    R_matrix_diag: [20, 20]

  adrc_controller:
    goal_distance_tolerance: 1.5
    goal_speed_tolerance: 0.25
    lookahead_time: 2.6
    command_limit: 1.0
    sample_time: 0.1
    max_sample_gap: 0.5
    k_p_speed: 8.0
    k_i_speed: 4.0
    force_min: -361.0
    force_max: 361.0
    speed_integral_min: -361.0
    speed_integral_max: 361.0
    # 转弯与单障碍闭环调定；原始 1.5/0.5 在转弯试验超过 4 m 横向边界。
    k_p_heading: 8.0
    k_d_heading: 4.0
    k_i_heading: 0.03
    moment_min: -10.0
    moment_max: 10.0
    heading_integral_min: -10.0
    heading_integral_max: 10.0
    error_reset_deg: 20.0
    acceleration_gain: 0.0
    filter_window_length: 10
    filter_history_length: 50

  # 终点/独立定点值守：位置外环 + 独立 ADRC 速度/艏向内环。
  station_adrc_controller:
    position_tolerance: 0.5
    heading_tolerance_deg: 5.0
    position_speed_gain: 0.5
    recover_speed: 0.3
    recover_speed_tolerance: 0.04
    alignment_time: 1.0
    alignment_yaw_rate: 0.02
    free_heading_yaw_damping: 10.0
    k_p_speed: 30.0
    k_i_speed: 0.8
    force_min: -20.0
    force_max: 20.0
    speed_integral_min: -8.0
    speed_integral_max: 8.0
    k_p_heading: 12.0
    k_d_heading: 10.0
    k_i_heading: 0.03
    moment_min: -8.0
    moment_max: 8.0
    heading_integral_min: -0.25
    heading_integral_max: 0.25
    sample_time: 0.1
    max_sample_gap: 0.5
    error_reset_deg: 20.0
    acceleration_gain: 0.0
    filter_window_length: 10
    filter_history_length: 50
    command_limit: 0.4
    command_slew_rate: 0.6

  # 0924 推力分配器：航控唯一输出口把归一化左右桨命令换算成桨角（rad）和转速（rpm），经东湖 0054 发出。
  # 推力 = 推力系数 × 水密度 × 桨径⁴ × (rpm/60)²；桨间距由 dynamics.D 推出（间距 = 2D），不在此配置。
  # 桨径与推力系数沿用 0924 交付值，实船需按系泊拉力试验标定。
  thrust_allocator:
    water_density: 1000.0
    propeller_diameter: 0.259
    thrust_coefficient: 0.5
    # 转速上下限须覆盖 dynamics.max_force：180 N 对应 536.66 rpm，取 ±537；低于 max_force 时启动报错。
    left_rpm_min: -537.0
    left_rpm_max: 537.0
    right_rpm_min: -537.0
    right_rpm_max: 537.0
